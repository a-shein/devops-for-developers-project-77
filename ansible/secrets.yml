# Расшифровывает ansible/vault.yml и рендерит terraform/secrets.auto.tfvars.
- hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vault.yml
  tasks:
    - name: Render Terraform variables from vault
      template:
        src: templates/secrets.auto.tfvars.j2
        dest: "{{ playbook_dir }}/../terraform/secrets.auto.tfvars"
        mode: "0600"
